[workspace]
name = "performance-minicourse"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
dask = "*"
distributed = "*"
ipympl = "*"
ipywidgets = "*"
jax = ">=0.7"
jupyterlab = ">=4"
line_profiler = "*"
matplotlib = ">=3.10"
numba = ">=0.60"
numexpr = ">=2.10"
numpy = ">=2"
pandas = ">=2"
plumbum = ">=1.10"
pytest = "*"
python = ">=3.13"
python-graphviz = "*"
rich = "*"
scipy = ">=1.15"

[tasks]
# Graphviz ships without a plugin config; dask's .visualize() fails until it is built
dot-config = "dot -c"
lab = { cmd = "jupyter lab", depends-on = ["dot-config"] }
